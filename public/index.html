<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bluffin</title>
<meta name="description" content="Bluffin: jogo online de dedução e blefe para jogar com os amigos, com áudio dentro do jogo.">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bluffin">
<meta property="og:title" content="Bluffin — ache o impostor">
<meta property="og:description" content="Todo mundo sabe a palavra. Menos um. Jogue com os amigos pelo navegador.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF6A00'/%3E%3Ctext x='50' y='72' font-size='64' font-weight='800' text-anchor='middle' fill='%230A0A0A' font-family='sans-serif'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--sf:#171717;--ink:#FFFFFF;--mut:#A6A6A6;--or:#FF6A00;--ln:#2E2E2E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1100px 650px at 50% -8%,#1c1206 0%,var(--bg) 62%) var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.4}

.layout{display:flex;justify-content:center;align-items:flex-start;gap:20px;min-height:100vh;max-width:1000px;margin:0 auto;padding:20px 18px}
#app{flex:1;max-width:600px;min-width:0;display:flex;flex-direction:column;gap:14px;position:relative}

@media(min-width:1000px){
 .layout{padding:36px 20px}
 #app{border:1px solid var(--ln);border-radius:28px;box-shadow:0 40px 90px -40px rgba(0,0,0,.85);padding:20px 18px 40px}
}
@media(max-width:999px){
 .layout{display:block;padding:0}
 #app{max-width:100%;padding:20px 18px calc(38vh + 40px + env(safe-area-inset-bottom,0px));border:none;border-radius:0;box-shadow:none;margin:0}
 #chat-panel{position:fixed;left:0;right:0;bottom:0;height:38vh;max-height:400px;border-radius:20px 20px 0 0;border-bottom:none;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 32px -8px rgba(0,0,0,.5)}
}

h1{font-size:clamp(52px,14vw,76px);line-height:.9;margin:18px 0 4px;font-weight:800;letter-spacing:-3px;background:linear-gradient(135deg,#fff 15%,#ffd9b3 65%,var(--or) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 i{display:block;width:84px;height:10px;background:var(--or);border-radius:5px;margin-top:10px}
h2{font-size:28px;line-height:1.1;margin:8px 0 0;font-weight:800;letter-spacing:-.5px}
p{margin:0}.mut{color:var(--mut);font-size:16px}
.btn{font:inherit;font-weight:800;min-height:56px;width:100%;border:2px solid var(--ink);border-radius:16px;background:transparent;color:var(--ink);padding:12px 16px;cursor:pointer}
.btn:hover:not(:disabled){background:#1f1f1f}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.p{background:var(--or);border-color:var(--or);color:#0A0A0A}.btn.p:hover:not(:disabled){background:#ff7f26}
.btn.g{border-color:var(--ln);font-weight:600}
.btn.tiny{width:auto;min-height:32px;padding:4px 10px;font-size:13px;font-weight:700;border-radius:10px;border-width:1.5px}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{font:inherit;font-weight:600;min-height:50px;border:2px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:14px;padding:8px 10px;cursor:pointer;text-align:left}
.chip.on{border-color:var(--or);background:var(--or);color:#0A0A0A}
.row{display:flex;gap:8px}
input,textarea{font:inherit;width:100%;border:2px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--ink);padding:12px 14px;min-height:52px}
textarea{min-height:80px;resize:vertical}
.set{display:flex;flex-direction:column;gap:6px}.set b{font-weight:800}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .chip{min-height:44px;flex:1;text-align:center;padding:6px 10px}
.card{background:var(--sf);border:2px solid var(--ln);border-radius:20px;padding:16px}
.secret{border-radius:24px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:8px;font-weight:800}
.secret.hid{background:repeating-linear-gradient(135deg,var(--or) 0 14px,#0A0A0A 14px 28px);color:#fff;font-size:24px;border:2px solid var(--or)}
.secret.hid span{background:#0A0A0A;padding:6px 12px;border-radius:10px}
.secret.word{background:#fff;color:#0A0A0A;font-size:38px;letter-spacing:-1px}
.secret.imp{background:#D7191F;color:#fff;border:2px solid #FF5A5F;box-shadow:0 0 40px -10px #D7191F;font-size:36px;letter-spacing:-1px}
.secret .hint{background:rgba(0,0,0,.3);padding:8px 14px;border-radius:12px;margin-top:6px;font-weight:700;font-size:15px}
.secret small{font-size:16px;font-weight:600}
.code{font-size:clamp(40px,11vw,60px);font-weight:800;letter-spacing:clamp(4px,2vw,10px);text-align:center;color:var(--or)}
.ord{display:flex;flex-direction:column;gap:8px}
.ord div{display:flex;gap:10px;align-items:center;padding:11px 14px;border:2px solid var(--ln);border-radius:14px;background:var(--sf)}
.ord .now{border-color:var(--or);background:var(--or);color:#0A0A0A;font-weight:800;font-size:22px}
.ord .done{opacity:.4;text-decoration:line-through}
.off{opacity:.45}
.timer{font-size:72px;font-weight:800;text-align:center;letter-spacing:-2px;font-variant-numeric:tabular-nums}.timer.end{color:var(--or)}
.bar{display:flex;align-items:center;gap:10px;margin:4px 0}.bar span:first-child{flex:0 0 38%;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.bar i{display:block;height:22px;background:#fff;border-radius:8px;min-width:6px}.bar.top i{background:var(--or)}
.win{font-size:40px;font-weight:800;line-height:1;letter-spacing:-1px}.win.g{color:#fff}.win.i{color:var(--or)}
.err{color:var(--or);font-weight:600}
.vbox{border:2px solid var(--ln);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.live{color:var(--or);font-weight:800}
.btn,.chip{transition:background .15s ease,transform .08s ease,box-shadow .15s ease,border-color .15s ease}
.btn:active:not(:disabled),.chip:active{transform:scale(.97)}
.btn.p{box-shadow:0 10px 24px -12px rgba(255,106,0,.65)}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pro-pill{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#FF6A00,#FFC24D);color:#0A0A0A;font-weight:800;font-size:13px;padding:7px 13px;border-radius:999px;border:none;cursor:pointer;white-space:nowrap;margin-top:30px;flex:0 0 auto}
.pro-pill:active{transform:scale(.96)}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.modal{background:var(--sf);border:2px solid var(--ln);border-radius:22px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
.modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--mut)}
.adslot{border:2px dashed var(--ln);border-radius:16px;padding:16px;text-align:center;color:var(--mut);font-size:13px;font-weight:600;line-height:1.5}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#0A0A0A;flex:0 0 auto}
.foot{text-align:center;color:var(--mut);font-size:13px;margin-top:4px}
.swgrid{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg)}
.chip.emoji{min-height:44px;text-align:center;font-size:20px;padding:6px}
.siderail{position:fixed;top:50%;transform:translateY(-50%);width:170px;display:none}
.siderail.l{left:calc(50% - 664px)}
.siderail.r{right:calc(50% - 664px)}
.siderail .adslot{min-height:480px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
@media (min-width:1380px){.siderail{display:block}}
@media (prefers-reduced-motion:no-preference){.secret{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}}

/* ---------- topo ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.topbar .row{flex:0 0 auto}

/* ---------- chat fixo ---------- */
#chat-panel:empty{display:none}
#chat-panel{flex:0 0 320px;position:sticky;top:20px;height:calc(100vh - 40px);max-height:600px;background:var(--sf);border:2px solid var(--ln);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.chat-header{padding:12px 16px;border-bottom:3px solid var(--ln);font-family:"Press Start 2P",ui-monospace,monospace;font-size:11px;flex:0 0 auto;letter-spacing:.5px}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.chat-input-row{border-top:3px solid var(--ln);padding:10px;display:flex;gap:8px;flex:0 0 auto;background:var(--sf)}
.chat-input-row input{flex:1;min-height:42px;padding:8px 12px}
.chat-input-row button{min-height:42px;width:auto;padding:0 16px;font-size:16px;flex:0 0 auto;font-weight:800}
.chat-msg{border:2px solid var(--ln);background:var(--bg);padding:7px 10px;display:flex;flex-direction:column;gap:3px;max-width:92%;align-self:flex-start}
.chat-msg.mine{align-self:flex-end;border-color:#2EA8FF}
.chat-msg-name{font-size:11px;font-weight:800;color:var(--or);letter-spacing:.3px;line-height:1}
.chat-msg.mine .chat-msg-name{color:#2EA8FF}
.chat-msg-text{font-size:15px;line-height:1.35;word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap}

/* ---------- Q&A ---------- */
.qa-q{font-size:20px;font-weight:800;padding:14px;border:2px solid var(--or);border-radius:14px;background:#1e1408}
.qa-answers{display:flex;flex-direction:column;gap:8px}
.qa-ans.active{border-color:var(--or);box-shadow:0 0 0 1px var(--or)}
.qa-ans{padding:10px 14px;border:2px solid var(--ln);border-radius:12px;display:flex;flex-direction:column;gap:4px;background:var(--sf)}
.qa-ans b{font-size:13px;color:var(--or)}
.qa-ans span{font-size:15px}
.qa-ans:not(.done) span{color:var(--mut);font-style:italic}

/* ---------- toast ---------- */
.toast{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--or);color:#0A0A0A;padding:10px 18px;border-radius:12px;font-weight:800;font-size:14px;z-index:100;box-shadow:0 8px 24px -8px rgba(255,106,0,.6);max-width:calc(100vw - 40px);text-align:center;animation:toastIn .18s ease-out}
@keyframes toastIn{from{transform:translate(-50%,-12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ===== sala de espera: tema impostor pixel ===== */
.px-scene{position:relative;height:168px;margin:4px 0 2px;border:4px solid #2a1f4d;background:linear-gradient(#0b0720,#1a1033 70%,#241447);box-shadow:6px 6px 0 #000;overflow:hidden}
.px-stars{position:absolute;left:0;top:0;width:3px;height:3px;color:#fff;background:currentColor;box-shadow:24px 20px,88px 52px #9fe8ff,150px 14px,214px 66px,280px 26px #ffd9b3,340px 70px,402px 18px,468px 48px #9fe8ff,520px 24px,48px 96px,120px 84px,246px 100px #ffd9b3,372px 92px,500px 90px;animation:tw 2.4s steps(2) infinite}
.px-stars.b{left:14px;top:12px;opacity:.6;animation-delay:1.2s}
@keyframes tw{50%{opacity:.15}}
.px-lamp{position:absolute;top:10px;left:10px;width:14px;height:14px;background:#ff2d4a;box-shadow:0 0 0 3px #000,0 0 18px 4px rgba(255,45,74,.6);animation:lamp 1s steps(2) infinite}
@keyframes lamp{50%{opacity:.3;box-shadow:0 0 0 3px #000}}
.px-floor{position:absolute;left:0;right:0;bottom:0;height:26px;background:repeating-linear-gradient(90deg,#2b2142 0 24px,#231a38 24px 48px);border-top:4px solid #3b2d63}
.px-crew{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:0 8px;z-index:1}
.px-c,.px-sus{flex:0 1 38px;min-width:14px;position:relative}
.px-c{animation:bob 1.1s steps(2) infinite}
.px-c.off{opacity:.35;filter:grayscale(1)}
.px-c svg,.px-sus svg,.pl svg{display:block;width:100%}
@keyframes bob{50%{transform:translateY(-3px)}}
.px-sus{margin-left:10px;animation:sus 3s steps(1) infinite}
.px-sus::before{content:"?";position:absolute;top:-22px;left:50%;margin-left:-6px;font-family:"Press Start 2P",monospace;font-size:14px;color:#ff2d4a;animation:bob .8s steps(2) infinite}
@keyframes sus{0%,90%,100%{opacity:.9}92%,96%{opacity:.25}}
.px-t{font-family:"Press Start 2P",ui-monospace,monospace;letter-spacing:0;font-size:18px;line-height:1.4;margin:12px 0 0;text-transform:uppercase;text-shadow:3px 3px 0 #ff2d4a}
.wm{position:relative;height:18px;font-family:"Press Start 2P",ui-monospace,monospace;font-size:10px;color:#ff6b81;text-transform:uppercase}
.wm span{position:absolute;left:0;top:0;white-space:nowrap;opacity:0;animation:wm 12s infinite;animation-delay:calc(var(--i)*3s)}
@keyframes wm{0%{opacity:0;transform:translateY(5px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0}}
.px-st{font-family:"Press Start 2P",ui-monospace,monospace;font-size:9px;color:var(--mut)}
.px-dot{color:#5CD65C;animation:tw 1s steps(2) infinite}
.pls{display:flex;flex-direction:column;gap:10px}
.pl{display:flex;align-items:center;gap:10px;padding:8px 12px;border:3px solid #3b2d63;background:#150f26;box-shadow:4px 4px 0 #000}
.pl.new{animation:pin .3s steps(4)}
@keyframes pin{from{transform:translateX(-24px);opacity:0}}
.pl svg{width:28px;flex:0 0 auto}
.pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.pe{font-size:18px}
.tg{font-family:"Press Start 2P",ui-monospace,monospace;font-size:8px;padding:4px 5px;background:#ff2d4a;color:#fff}
.tg.me{background:#2EA8FF;color:#0A0A0A}
.code{font-family:"Press Start 2P",ui-monospace,monospace;font-size:40px;letter-spacing:8px;padding:28px 8px 18px 16px;color:#ffd9b3;background:#0b0716;border:4px solid var(--or);box-shadow:5px 5px 0 #000,inset 0 0 0 3px #0b0716,inset 0 0 0 5px #3b2d63;text-shadow:3px 3px 0 #b34700;position:relative}
.code::before{content:"CÓDIGO DA SALA";position:absolute;top:10px;left:0;right:0;font-size:8px;letter-spacing:2px;color:var(--mut);text-shadow:none}
#app.lobby{background:linear-gradient(#0d0818,#0A0A0A 380px);border-color:#2a1f4d}
.btn,.chip,.card,.vbox,textarea,input,.adslot,.modal,#chat-panel,.chat-msg,.secret,.code,.ord div,.bar i{border-radius:0!important;border-width:3px}
.btn.p,.chip.on{box-shadow:4px 4px 0 #000}
.btn:active:not(:disabled),.chip:active{transform:translate(3px,3px);box-shadow:none}
.card,.vbox,.secret,.modal,#chat-panel{box-shadow:5px 5px 0 #000}
h1,h2,.btn,.chip,.win,.code,.timer,.tg,.chat-header,.pro-pill,.ord .now{font-family:"Press Start 2P",ui-monospace,monospace}
h1{font-size:clamp(30px,9vw,46px);letter-spacing:0;line-height:1.3}
h2{font-size:clamp(15px,4vw,20px);letter-spacing:0;line-height:1.6;text-shadow:3px 3px 0 var(--or)}
.btn,.chip{font-size:12px;line-height:1.5;letter-spacing:0;padding:14px 14px}
.chip.emoji{font-size:18px}
.win{font-size:clamp(18px,5.5vw,26px);letter-spacing:0;line-height:1.7;text-shadow:3px 3px 0 #000}
.code{letter-spacing:clamp(2px,1.5vw,6px);font-size:clamp(30px,9vw,46px)}
.timer{font-size:clamp(36px,11vw,52px);letter-spacing:0}
.secret small{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.secret .hint{font-family:"Bricolage Grotesque",system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){.px-c,.px-stars,.px-lamp,.px-sus,.px-sus::before,.pl.new,.px-dot{animation:none}.wm span{animation:none}.wm span:first-child{opacity:1}}
</style>
</head>
<body>
<div class="siderail l"><div class="adslot">📣<br>Espaço para anúncio<br><span style="opacity:.6">(desktop)</span></div></div>
<div class="layout">
  <div id="app"></div>
  <aside id="chat-panel"></aside>
</div>
<div class="siderail r"><div class="adslot">📣<br>Espaço para anúncio<br><span style="opacity:.6">(desktop)</span></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k)||"";v===null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){return ""}};
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}};
let pid=ss("bf_pid");if(!pid){pid=Math.random().toString(36).slice(2,10);ss("bf_pid",pid)}
const CAT=[["des","🎨","Desenhos e animações"],["jog","🎮","Jogos e videogames"],["fil","🎬","Filmes e séries"],["per","🦸","Personagens"],["fut","⚽","Futebol"],["cel","⭐","Celebridades"],["ani","🐧","Animais"],["com","🍕","Comidas"],["lug","📍","Lugares"],["obj","🔑","Objetos"]];
const U={
  scr:"entry",name:ls("bf_name"),code:"",err:"",rv:false,ri:-1,gs:"",busy:false,modal:null,copied:false,copiedInvite:false,pro:ls("bf_pro")==="1",cw:null,avc:ls("bf_avc")||"#FF6A00",avem:ls("bf_avem")||"",
  chat:[],chatInput:"",toast:"",toastT:null,
  askInput:"",ansInput:"",lastQaSub:"",lastQaTurnIdx:-1
};
const AV_CLR=["#FF6A00","#FF3D7F","#7C5CFF","#00C2A8","#2EA8FF","#FFD400","#5CD65C","#FF5C5C"];
const AV_EM=["","😀","😎","🤖","🐱","🐶","🦊","🐸","🐼","🦄","👑","🎲","🔥","🧠","🕵️","🎭"];
const av=(clr,em,n)=>'<div class="av" style="background:'+(clr||AV_CLR[0])+'">'+(em?esc(em):esc((n||"?").trim().slice(0,1).toUpperCase()))+'</div>';
function profilePicker(){
 const sw=AV_CLR.map(c=>'<button class="swatch'+(U.avc===c?" on":"")+'" data-a="avc" data-v="'+c+'" style="background:'+c+'" aria-label="Cor"></button>').join("");
 const em=AV_EM.map(e=>'<button class="chip emoji'+(U.avem===e?" on":"")+'" data-a="avem" data-v="'+esc(e)+'">'+(e||"Aa")+'</button>').join("");
 return '<div class="set"><b>Seu perfil</b><div class="row" style="align-items:center;gap:12px">'+av(U.avc,U.avem,U.name)+'<div class="swgrid">'+sw+'</div></div><div class="grid" style="grid-template-columns:repeat(4,1fr);margin-top:8px">'+em+'</div></div>';
}
function adSlot(id){return '<div class="adslot" data-slot="'+esc(id||"")+'">📣 Espaço reservado para anúncio</div>'}
function proModal(){
 if(!U.modal)return "";
 return '<div class="modal-ov"><div class="modal"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">✨ Bluffin PRO</h2><button class="btn g" data-a="closeModal" style="width:auto;min-height:auto;padding:4px 10px;border-radius:10px">✕</button></div><p class="mut">Em breve: sem anúncios, temas exclusivos e mais opções pra sua sala.</p><ul><li>Sem anúncios</li><li>Temas e palavras exclusivas</li><li>Salas maiores</li><li>Cores e emblemas no perfil</li></ul><button class="btn p" data-a="closeModal">Entendi, já volto</button></div></div>'
}
function shade(h,f){const n=parseInt(h.slice(1),16);return "#"+[16,8,0].map(k=>Math.round(((n>>k)&255)*f).toString(16).padStart(2,"0")).join("")}

let S=null,ws=null,off=0,ICE=[{urls:"stun:stun.l.google.com:19302"}],tt=null,lastSig="",retry=0,wantCreate=false;
const V={on:false,muted:false,stream:null,pcs:{},auds:{}};

function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(create,code){
 U.busy=true;U.err="";wantCreate=create;rr();
 ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
 ws.onopen=()=>{retry=0;send({t:"join",name:U.name,pid,create,code,clr:U.avc,em:U.avem})};
 ws.onmessage=e=>{
  let m;try{m=JSON.parse(e.data)}catch(_){return}
  if(m.t==="s"){
   off=m.now-Date.now();delete m.now;S=m;U.scr="game";U.busy=false;U.err="";U.code=m.code;ss("bf_room",m.code);
   if(Array.isArray(m.chat)){
     const ids=new Set(U.chat.map(x=>x.id));
     for(const c of m.chat) if(!ids.has(c.id)) U.chat.push(c);
     U.chat.sort((a,b)=>a.ts-b.ts);
     if(U.chat.length>100) U.chat=U.chat.slice(-100);
   }
   if(U.ri!==m.ri){U.ri=m.ri;U.rv=false;U.gs="";U.discOpen=null}
   // Resetar inputs quando muda turno/subfase
   if(m.qa){
     if(U.lastQaSub!==m.qa.sub || U.lastQaTurnIdx!==m.qa.turnIdx){
       if(m.qa.sub==="ask") U.askInput=""; else U.ansInput="";
       U.lastQaSub=m.qa.sub; U.lastQaTurnIdx=m.qa.turnIdx;
     }
   } else {
     U.lastQaSub=""; U.lastQaTurnIdx=-1;
   }
   voiceSync();rr();
  }
  else if(m.t==="chat"){
   U.chat.push(m.msg);
   if(U.chat.length>100) U.chat.shift();
   rr();
  }
  else if(m.t==="sys"){U.toast=m.m;rr();clearTimeout(U.toastT);U.toastT=setTimeout(()=>{U.toast="";rr()},3500)}
  else if(m.t==="ice")ICE=m.ice;
  else if(m.t==="sig")onSig(m.from,m.d);
  else if(m.t==="err"){U.err=m.m;U.busy=false;U.scr="entry";S=null;ss("bf_room",null);try{ws.onclose=null;ws.close()}catch(_){};rr()}
 };
 ws.onclose=()=>{if(U.scr==="game"&&ss("bf_room")){const code=ss("bf_room");setTimeout(()=>connect(false,code),Math.min(5000,1000*(++retry)))}else{U.busy=false;rr()}};
}

/* ---------- áudio ---------- */
function canTalk(id){
 if(!S||S.cfg.voice==="off")return false;
 if(S.ph==="role")return false;
 if(S.cfg.voice==="open")return true;
 // modo "turns": só fala quem está na vez de perguntar
 if(S.ph==="qa" && S.qa && S.qa.sub==="ask") return S.qa.currentPlayer === id;
 return true;
}
async function voiceJoin(){
 try{V.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
 catch(e){U.err="Não consegui acessar o microfone. Libere a permissão no navegador (precisa de HTTPS).";rr();return}
 V.on=true;V.muted=false;U.err="";send({t:"voice",on:true});voiceSync();rr();
}
function voiceLeave(){
 Object.keys(V.pcs).forEach(hang);if(V.stream)V.stream.getTracks().forEach(t=>t.stop());
 V.stream=null;V.on=false;send({t:"voice",on:false});rr();
}
function hang(id){const pc=V.pcs[id];if(pc){pc.onicecandidate=null;pc.close();delete V.pcs[id]}const a=V.auds[id];if(a){a.srcObject=null;delete V.auds[id]}}
function voiceSync(){
 if(!S)return;
 if(V.on&&S.cfg.voice==="off"){voiceLeave();return}
 const self=S.players.find(p=>p.id===S.me);
 if(V.on&&self&&!self.v)send({t:"voice",on:true});
 if(V.stream)V.stream.getAudioTracks().forEach(t=>t.enabled=!V.muted&&canTalk(S.me));
 S.players.forEach(p=>{if(p.id===S.me)return;
  if(V.on&&p.v&&!V.pcs[p.id]&&S.me<p.id)call(p.id);
  if((!V.on||!p.v)&&V.pcs[p.id])hang(p.id);
  const a=V.auds[p.id];if(a)a.muted=!canTalk(p.id)});
}
function mkpc(id){
 const pc=new RTCPeerConnection({iceServers:ICE});V.pcs[id]=pc;
 V.stream.getTracks().forEach(t=>pc.addTrack(t,V.stream));
 pc.onicecandidate=e=>{if(e.candidate)send({t:"sig",to:id,d:{c:e.candidate}})};
 pc.ontrack=e=>{let a=V.auds[id];if(!a){a=new Audio();a.autoplay=true;V.auds[id]=a}a.srcObject=e.streams[0];a.muted=!canTalk(id);a.play().catch(()=>{})};
 pc.onconnectionstatechange=()=>{if(pc.connectionState==="failed"&&V.pcs[id]===pc){hang(id);setTimeout(voiceSync,1500)}};
 return pc;
}
async function flush(pc){const q=pc.q||[];pc.q=[];for(const c of q){try{await pc.addIceCandidate(c)}catch(e){}}}
async function call(id){
 try{
  const pc=mkpc(id);
  await pc.setLocalDescription(await pc.createOffer());
  send({t:"sig",to:id,d:{s:pc.localDescription}});
 }catch(e){console.warn("offer falhou",id,e);hang(id)}
}
async function onSig(from,d){
 if(!V.on||!V.stream)return;let pc=V.pcs[from];
 try{
  if(d.s){
   if(d.s.type==="offer"){if(pc)hang(from);pc=mkpc(from);await pc.setRemoteDescription(d.s);await pc.setLocalDescription(await pc.createAnswer());send({t:"sig",to:from,d:{s:pc.localDescription}});await flush(pc)}
   else if(pc){await pc.setRemoteDescription(d.s);await flush(pc)}
  }else if(d.c&&pc){if(pc.remoteDescription)await pc.addIceCandidate(d.c);else(pc.q=pc.q||[]).push(d.c)}
 }catch(e){}
}

 case "disc":{
  let poll="";
  if(S.poll)poll='<div class="card"><b>Mais uma rodada de perguntas?</b><p class="mut">Sim '+S.poll.yes+' · Não '+S.poll.no+' · '+S.poll.n+' online. A maioria decide.</p>'+(inG?'<div class="row"><button class="chip '+(S.poll.mine===true?"on":"")+'" data-a="moreVote" data-y="1" style="flex:1;text-align:center">Sim</button><button class="chip '+(S.poll.mine===false?"on":"")+'" data-a="moreVote" data-y="0" style="flex:1;text-align:center">Não</button></div>':'')+(isH()?'<button class="btn g" data-a="moreClose" style="margin-top:8px">Encerrar votação agora</button>':'')+'</div>';
  else if(inG&&S.hr<10)poll='<button class="btn g" data-a="moreAsk">Pedir mais uma rodada de perguntas</button>';
  return top+'<h2>Discussão</h2><p class="mut">'+(S.msg?esc(S.msg)+' ':'')+'Quem respondeu de forma vaga? Quem fugiu da pergunta?</p>'+(S.te?'<div class="timer" id="tm"></div>':'<div class="card mut">Tempo livre. O anfitrião inicia a votação.</div>')+discAnswersBlock()+poll+vb+(inG?roleBlock():'')+hb("toVote","Iniciar a votação")}
 case "vote":{
  if(!inG)return top+'<h2>Votação</h2><p class="mut">Aguarde a próxima rodada.</p>'+vb;
  return top+'<h2>Quem é o impostor?</h2><p class="mut">'+(S.vr?"Desempate. ":"")+(S.ni>1?'Há '+S.ni+' impostores. Vote em quem você mais suspeita. ':'')+'Voto secreto, dá para mudar até todos votarem.</p><div class="grid">'+S.cd.filter(i=>i!==S.me).map(i=>'<button class="chip '+(S.myvote===i?"on":"")+'" data-a="vote" data-i="'+i+'">'+esc(nm(i))+'</button>').join("")+'</div><p class="mut">Votos registrados: '+S.nvote+' de '+S.pl.length+'</p>'+vb+hb("forceVote","Apurar agora com os votos que chegaram")}
 case "tie":return top+'<h2>Empate!</h2><p>Empataram: <b>'+S.cd.map(i=>esc(nm(i))).join(", ")+'</b>.</p><p class="mut">Conversem mais um pouco e votem de novo, só entre os empatados.</p>'+vb+hb("revote","Votar de novo");
 case "tally":{const mx=Math.max(1,...Object.values(S.cn));
  return top+'<h2>Resultado da votação</h2>'+Object.keys(S.cn).map(i=>'<div class="bar '+(S.acc.includes(i)?"top":"")+'"><span>'+esc(nm(i))+'</span><i style="width:'+(Math.round(S.cn[i]/mx*50)||1)+'%"></i><b>'+S.cn[i]+'</b></div>').join("")+'<div class="card">'+(S.acc.length?'O grupo apontou <b>'+S.acc.map(i=>esc(nm(i))).join(" e ")+'</b>.':'<b>Empate.</b> O grupo não chegou a um nome.')+'</div>'+vb+hb("reveal","Revelar o impostor")}
 case "guess":{const isI=S.im.includes(S.me);
  return top+'<h2>Impostor descoberto!</h2><p>'+S.im.map(i=>esc(nm(i))).join(" e ")+(S.im.length>1?" eram os impostores":" era o impostor")+'.</p>'+(isI?(S.guessed?'<p class="mut">Chute enviado. Aguardando o resultado.</p>':'<p class="mut">Última chance: escreva a palavra secreta. Só uma tentativa.</p><input id="gs" placeholder="Qual era a palavra?" autocomplete="off" value="'+esc(U.gs)+'"><button class="btn p" data-a="guess">Chutar</button>'):'<p class="mut">Aguardando o chute final. Sem soprar a resposta!</p>')+vb}
 case "final":{const gr=S.won==="g";
  const why=!S.im.every(i=>S.acc.includes(i))?(S.tg?"A votação empatou e o impostor escapou.":"Pelo menos um impostor escapou."):(S.last?(gr?"Descobertos, e erraram a palavra"+(S.gt?" (chute: “"+esc(S.gt)+"”)":"")+".":"Descobertos, mas acertaram a palavra!"):"Todos os impostores foram descobertos.");
  return '<div class="win '+(gr?"g":"i")+'">'+(gr?"O grupo venceu":"Impostor venceu")+'</div><p>'+why+'</p><div class="card"><div class="mut">'+(S.im.length>1?"Impostores":"Impostor")+'</div><b style="font-size:24px">'+S.im.map(i=>esc(nm(i))).join(" e ")+'</b><div class="mut" style="margin-top:8px">Palavra · '+esc(S.ct||"")+'</div><b style="font-size:24px">'+esc(S.wd)+'</b>'+(S.dc?'<div class="mut" style="margin-top:8px">Palavra do impostor</div><b style="font-size:24px">'+esc(S.dc)+'</b>':'')+'</div><div class="card"><b>Placar</b>'+S.pl.map(i=>'<div class="bar"><span>'+esc(nm(i))+'</span><b>'+(S.sc[i]||0)+'</b></div>').join("")+'</div>'+adSlot("final")+vb+hb("start","Próxima rodada",S.players.filter(p=>p.on).length<3)+hb("restart","Reiniciar partida (zera placar)")+(isH()?'<button class="btn g" data-a="lobby">Trocar tema ou ajustes</button>':'<p class="mut">O anfitrião escolhe a próxima rodada.</p>')}
 }
 return top;
}
function entry(){
 return '<div class="brand"><h1>Bluffin<i></i></h1><button class="pro-pill" data-a="pro">✨ PRO</button></div><p class="mut">Todo mundo sabe a palavra. Menos um. Faça perguntas, responda com cuidado e descubra quem está blefando.</p><div class="set"><b>Seu nome</b><input id="nm" maxlength="14" placeholder="Como os amigos vão te ver" value="'+esc(U.name)+'"></div>'+profilePicker()+(U.err?'<p class="err">'+esc(U.err)+'</p>':'')+'<button class="btn p" data-a="create" '+(U.busy?"disabled":"")+'>Criar sala</button><div class="row"><input id="cd" maxlength="4" placeholder="CÓDIGO" style="text-transform:uppercase;letter-spacing:4px;text-align:center" value="'+esc(U.code)+'"><button class="btn" data-a="join" style="width:auto" '+(U.busy?"disabled":"")+'>Entrar</button></div>'+adSlot("entry")+'<p class="foot">Bluffin · feito pra jogar com os amigos</p>';
}
function chatPanel(){
 // O chat aparece assim que o jogador entra na sala e permanece disponível em todas as fases.
 if(!S||U.scr!=="game")return "";
 const msgs=U.chat.length===0
   ?'<p class="mut" style="text-align:center;padding:20px 12px;font-size:14px">Nenhuma mensagem ainda. Diga um oi 👋</p>'
   :U.chat.map(c=>{
     const cls=c.from===S.me?"chat-msg mine":"chat-msg";
     return '<div class="'+cls+'"><span class="chat-msg-name">'+esc(c.name||"?")+'</span><span class="chat-msg-text">'+esc(c.text)+'</span></div>';
   }).join("");
 return '<div class="chat-header">💬 Chat</div><div class="chat-msgs" id="chat-msgs">'+msgs+'</div><div class="chat-input-row"><input id="chat-in" maxlength="200" placeholder="Mensagem..." autocomplete="off" value="'+esc(U.chatInput)+'"><button class="btn p" data-a="chatSend">➤</button></div>';
}
function render(){
 const sg=S?{...S,cfg:{...S.cfg,custom:0},chat:0,qa:0}:null;
 const lastChat=U.chat.length>0?U.chat[U.chat.length-1].id:"";
 const sig=JSON.stringify([U.scr,U.err,U.busy,U.rv,U.gs,sg,V.on,V.muted,U.modal,U.copied,U.copiedInvite,U.pro,U.toast,U.chat.length,lastChat,U.askInput.length>0,U.ansInput.length>0,U.discOpen]);
 if(sig===lastSig)return;lastSig=sig;
 const ae=document.activeElement,keep=ae&&ae.id,keepSel=(keep&&typeof ae.selectionStart==="number")?[ae.selectionStart,ae.selectionEnd]:null;
 const oldChatEl=$("chat-msgs");
 const oldChatScroll=oldChatEl?oldChatEl.scrollTop:0;
 const oldChatAtBottom=oldChatEl?(oldChatEl.scrollHeight-oldChatEl.scrollTop-oldChatEl.clientHeight<60):true;

 $("app").classList.toggle("lobby",!!(U.scr==="game"&&S&&S.ph==="lobby"));
 $("app").innerHTML=(U.scr==="game"&&S?game():entry())+proModal()+(U.toast?'<div class="toast">'+esc(U.toast)+'</div>':'');
 const cp=$("chat-panel");if(cp)cp.innerHTML=chatPanel();

 const newChatEl=$("chat-msgs");
 if(newChatEl) newChatEl.scrollTop=oldChatAtBottom?newChatEl.scrollHeight:oldChatScroll;

 if(keep){const el=$(keep);if(el){el.focus();if(keepSel&&typeof el.setSelectionRange==="function"){try{el.setSelectionRange(keepSel[0],keepSel[1])}catch(e){}}}}
 clearInterval(tt);
 if(S&&S.ph==="disc"&&S.te){const tick=()=>{const el=$("tm");if(!el)return;const l=Math.max(0,Math.ceil((S.te-(Date.now()+off))/1000));el.textContent=l?Math.floor(l/60)+":"+String(l%60).padStart(2,"0"):"Acabou o tempo";el.classList.toggle("end",!l)};tick();tt=setInterval(tick,500)}
 if(S&&S.ph==="guess"&&$("gs"))$("gs").focus();
}
const rr=()=>{lastSig="";render()};

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a;
 switch(a){
  case "create":case "join":{const n=($("nm").value||"").trim();if(!n){U.err="Digite seu nome.";rr();break}U.name=n.slice(0,14);ls("bf_name",U.name);
   if(a==="create")connect(true,"");else{const c=($("cd").value||"").trim().toUpperCase();if(!/^[A-Z]{4}$/.test(c)){U.err="Digite o código de 4 letras.";rr();break}connect(false,c)}break}
  case "cfg":{let v=b.dataset.v;if(v==="true")v=true;else if(v==="false")v=false;else if(/^\d+$/.test(v))v=+v;send({t:"cfg",k:b.dataset.k,v});break}
  case "start":case "lobby":case "ready":case "skipRole":case "skipQA":case "moreAsk":case "moreClose":case "toVote":case "forceVote":case "revote":case "reveal":send({t:a});break;
  case "moreVote":send({t:"moreVote",y:b.dataset.y==="1"});break;
  case "vote":send({t:"vote",to:b.dataset.i});break;
  case "guess":{const t=($("gs").value||"").trim();if(!t){$("gs").focus();break}send({t:"guess",text:t});break}
  case "ask":{const t=(U.askInput||"").trim();if(!t){const el=$("qa-ask");if(el)el.focus();break}send({t:"ask",text:t});U.askInput="";rr();break}
  case "answer":{const t=(U.ansInput||"").trim();if(!t){const el=$("qa-ans");if(el)el.focus();break}send({t:"answer",text:t});U.ansInput="";rr();break}
  case "rv":U.rv=!U.rv;rr();break;
  case "avc":U.avc=b.dataset.v;ls("bf_avc",U.avc);rr();break;
  case "avem":U.avem=b.dataset.v;ls("bf_avem",U.avem);rr();break;
  case "pro":U.modal="pro";rr();break;
  case "closeModal":U.modal=null;rr();break;
  case "discToggle":U.discOpen=U.discOpen===b.dataset.i?null:b.dataset.i;rr();break;
  case "copyCode":{if(!S)break;const ok=()=>{U.copied=true;rr();setTimeout(()=>{U.copied=false;rr()},1500)};
   if(navigator.clipboard)navigator.clipboard.writeText(S.code).then(ok).catch(()=>{});else ok();break}
  case "copyInvite":{if(!S)break;const text="Entra na minha sala de Bluffin! Código: "+S.code+" — "+location.origin;
   const ok=()=>{U.copiedInvite=true;rr();setTimeout(()=>{U.copiedInvite=false;rr()},1500)};
   if(navigator.clipboard)navigator.clipboard.writeText(text).then(ok).catch(()=>{});else ok();break}
  case "share":{if(!S)break;const text="Entra na minha sala de Bluffin! Código: "+S.code,url=location.origin;
   if(navigator.share)navigator.share({title:"Bluffin",text,url}).catch(()=>{});
   else if(navigator.clipboard){navigator.clipboard.writeText(text+" — "+url).then(()=>{U.copiedInvite=true;rr();setTimeout(()=>{U.copiedInvite=false;rr()},1500)}).catch(()=>{})}break}
  case "vjoin":voiceJoin();break;
  case "vleave":voiceLeave();break;
  case "vmute":V.muted=!V.muted;voiceSync();rr();break;
  case "chatSend":{const text=(U.chatInput||"").trim();if(!text)break;send({t:"chat",text});U.chatInput="";rr();setTimeout(()=>{const inp=$("chat-in");if(inp)inp.focus()},0);break}
  case "restart":{if(!isH())break;if(!confirm("Reiniciar partida? O placar será zerado."))break;send({t:"restart"});break}
  case "leave":voiceLeave();ss("bf_room",null);if(ws){ws.onclose=null;ws.close()}S=null;U.scr="entry";
   U.chat=[];U.chatInput="";U.askInput="";U.ansInput="";U.lastQaSub="";U.lastQaTurnIdx=-1;U.discOpen=null;
   rr();break;
 }
});
let cwT=null;
document.addEventListener("input",e=>{
 if(e.target.id==="nm"){U.name=e.target.value.slice(0,14);ls("bf_name",U.name)}
 if(e.target.id==="cw"){U.cw=e.target.value;clearTimeout(cwT);const v=e.target.value;cwT=setTimeout(()=>send({t:"cfg",k:"custom",v}),300)}
 if(e.target.id==="gs")U.gs=e.target.value;
 if(e.target.id==="chat-in")U.chatInput=e.target.value;
 if(e.target.id==="qa-ask")U.askInput=e.target.value;
 if(e.target.id==="qa-ans")U.ansInput=e.target.value;
});
document.addEventListener("keydown",e=>{
 if(e.key!=="Enter")return;
 const t=e.target.id;
 if(t==="chat-in"){if(e.shiftKey)return;e.preventDefault();document.querySelector('[data-a="chatSend"]').click();return}
 if(t==="qa-ask"){if(e.shiftKey)return;e.preventDefault();document.querySelector('[data-a="ask"]').click();return}
 if(t==="qa-ans"){if(e.shiftKey)return;e.preventDefault();document.querySelector('[data-a="answer"]').click();return}
 if(t==="nm"||t==="cd"){const b=document.querySelector('[data-a="'+(t==="cd"&&$("cd").value?"join":"create")+'"]');if(b)b.click();return}
 if(t==="gs")document.querySelector('[data-a="guess"]').click();
});
const saved=ss("bf_room");if(saved&&U.name)connect(false,saved);else render();
</script>
</body>
</html>
